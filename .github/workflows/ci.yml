name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    name: Teensy qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: ~/.platformio/.cache
          key: ${{ runner.os }}-platformio-6.1.18-${{ hashFiles('platformio.ini', 'library.json') }}

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.18

      - name: Build qualification firmware
        run: pio run -e release -j 2
